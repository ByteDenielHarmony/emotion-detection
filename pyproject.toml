[project]
name = "emotion-detection"
version = "0.1.0"
description = "English emotion detection and intensity estimation for SemEval-2025 Task 11"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "scikit-learn>=1.9.1",
    "torch>=2.6,<3",
    "transformers>=4.48,<5",
]

[project.scripts]
emotion = "emotion_detection.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "tokenizers>=0.22,<0.23",
    "uv-build>=0.13,<0.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"
